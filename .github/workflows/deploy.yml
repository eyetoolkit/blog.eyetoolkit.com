name: Deploy Blog (via ops-platform)

# Trigger: any push to main, or manual dispatch.
# The deploy logic is reusable — see eyetoolkit/ops-platform/.github/workflows/deploy-site.yml
# This file is a thin "trigger + config" wrapper.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy blog.eyetoolkit.com
    uses: eyetoolkit/ops-platform/.github/workflows/deploy-site.yml@main
    with:
      profile: eyetoolkit-blog
      ref: main
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_NOTIFY_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}